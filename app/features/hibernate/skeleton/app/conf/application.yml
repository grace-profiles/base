hibernate:
    dialect: org.hibernate.dialect.H2Dialect
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
dataSource:
    pooled: true
    driverClassName: org.h2.Driver
    username: sa
    password: ''

environments:
    development:
        dataSource:
            dbCreate: create-drop
            url: jdbc:h2:mem:@grace.codegen.projectSnakeCaseName@_dev;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
    test:
        dataSource:
            dbCreate: update
            url: jdbc:h2:mem:@grace.codegen.projectSnakeCaseName@_test;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
    production:
        dataSource:
            dbCreate: none
            url: jdbc:h2:./@grace.codegen.projectSnakeCaseName@_prod;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
